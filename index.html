<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Albie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0b16;font-family:'Cormorant Garamond',Georgia,serif;user-select:none}
.page{position:fixed;inset:0;opacity:0;pointer-events:none;transform:scale(1.05);filter:blur(10px);transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.page.active{opacity:1;pointer-events:auto;transform:none;filter:none}
.stage{position:absolute;left:50%;top:50%;width:1366px;height:768px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.stage>img.art{position:absolute;inset:0;width:100%;height:100%}
#p-pass{background:#2c0c4c}#p-cake{background:#ab98b3}#p-songs{background:#7d6797}#p-letter{background:#efecf2}#p-flowers{background:#000}

/* entrance animations (replay each time a page becomes active) */
.page.active .rise{animation:rise 1s .3s both cubic-bezier(.2,.8,.2,1)}
.page.active .art{animation:artIn 1.6s both cubic-bezier(.2,.8,.2,1)}
.page.active .art.float{animation:artIn 1.6s both cubic-bezier(.2,.8,.2,1),drift 9s 1.6s infinite ease-in-out}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes artIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes drift{50%{transform:scale(1.015) translateY(-4px)}}

/* passcode */
.cover{position:absolute;background:#2c0c4c}
.ptitle{position:absolute;left:0;width:1366px;top:56px;text-align:center;font-size:48px;color:#b3a0bb;font-weight:500}
.box{position:absolute;top:158px;width:94px;height:90px;border:4px solid #6c4f89;border-radius:16px;background:#2c0c4c;color:#b3a0bb;font:700 30px 'Courier New',monospace;display:flex;align-items:center;justify-content:center;transition:.2s}
.box.on{border-color:#b3a0bb}
.key{position:absolute;width:100px;height:100px;border-radius:50%;background:#b9a4bf;color:#7b5d92;font:700 32px 'Courier New',monospace;border:0;cursor:pointer;transition:transform .12s,background .12s}
.key:active{transform:scale(.88);background:#d7c4dc}
#msg{position:absolute;left:0;width:1366px;top:258px;text-align:center;font-size:30px;color:#ff9db5;opacity:0;transition:.3s;pointer-events:none}
#msg.show{opacity:1}
#boxes.shake{animation:shake .5s}
#boxes.ok .box{border-color:#d9f7c0;color:#d9f7c0;transform:scale(1.08)}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}

/* cake */
.glow{position:absolute;left:543px;top:140px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,0,.4),transparent 70%);animation:pulse 2s infinite;transition:opacity .4s;pointer-events:none}
@keyframes pulse{50%{opacity:.6}}
.cake-box{position:absolute;left:563px;top:150px;width:240px;display:flex;flex-direction:column;align-items:center;animation:float 4s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-8px)}}
.candle{cursor:pointer;display:flex;flex-direction:column;align-items:center;margin-bottom:-4px;z-index:10;padding:6px 20px}
.flame{width:16px;height:28px;background:linear-gradient(to top,#ff7675,#feca57,#fff);border-radius:50% 50% 30% 30%;animation:flicker .6s infinite ease-in-out;box-shadow:0 0 18px #ff9f43,0 0 35px #ff5252}
.flame.out{display:none}
.wick{width:2px;height:10px;background:#2d3436}
.stick{width:14px;height:42px;border-radius:2px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#74b9ff 6px,#74b9ff 12px)}
.icing{width:240px;height:32px;background:#fff;border-radius:18px 18px 0 0}
.drips{width:240px;height:14px;background:#fff;clip-path:polygon(0 0,100% 0,100% 30%,90% 100%,80% 30%,70% 90%,60% 20%,50% 100%,40% 30%,30% 90%,20% 20%,10% 80%,0 30%)}
.sponge{width:240px;height:80px;background:#f7d794;position:relative;box-shadow:inset 0 -6px rgba(0,0,0,.1)}
.filling{position:absolute;top:36px;width:100%;height:10px;background:#ff7675}
.plate{width:280px;height:16px;background:#f1f2f6;border-radius:20px;box-shadow:0 12px 24px rgba(0,0,0,.35);margin-top:-2px}
.greet{position:absolute;left:0;width:1366px;top:470px;text-align:center;font:400 62px 'Brush Script MT',cursive;color:#fff;text-shadow:0 2px 8px rgba(60,20,90,.5)}
.name{position:absolute;left:0;width:1366px;top:560px;text-align:center;font-size:40px;color:#3d2a55;font-weight:600;letter-spacing:2px}
.hint{position:absolute;left:0;width:1366px;top:640px;text-align:center;font-size:24px;color:#efe6f5;opacity:.8;animation:pulse 2s infinite}
@keyframes flicker{50%{transform:scale(1.1,.95) rotate(2deg)}}
.conf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(820px) rotate(720deg);opacity:.8}}

/* arrows */
.nav{position:absolute;bottom:26px;width:84px;height:84px;border-radius:50%;border:4px solid rgba(120,95,150,.7);background:rgba(235,225,242,.85);color:#9a86ad;font:400 50px/74px Georgia,serif;text-align:center;cursor:pointer;z-index:30;transition:transform .2s;animation:bob 2s infinite ease-in-out}
.nav:hover{transform:scale(1.1)}.nav.next{right:30px}.nav.back{left:30px}
@keyframes bob{50%{translate:4px 0}}
.nav.back{animation-name:bobl}@keyframes bobl{50%{translate:-4px 0}}
#fr{position:absolute;inset:0;width:100%;height:100%;border:0}

/* rotate-your-phone overlay */
#rot{position:fixed;inset:0;z-index:100;background:#0d0b16;display:none;align-items:center;justify-content:center}
.rbox{background:#000;width:min(92vw,520px);padding:48px 20px;display:flex;align-items:center;justify-content:center;gap:22px;color:#fff;font:400 26px/1.3 'Segoe UI',sans-serif;letter-spacing:1px}
.ph{width:78px;height:40px;border:3px solid #fff;border-radius:9px;animation:turn 2.4s infinite ease-in-out}
@keyframes turn{0%,30%{transform:rotate(90deg)}70%,100%{transform:rotate(0)}}
.bar{width:3px;align-self:stretch;background:#fff}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
.hit{position:absolute;border-radius:18px;cursor:pointer;z-index:20;transition:.25s}
.hit:hover{box-shadow:0 0 0 4px rgba(255,255,255,.75),0 0 30px rgba(255,255,255,.5);transform:scale(1.03)}
#player{position:absolute;left:290px;top:600px;width:420px;height:152px;z-index:25;opacity:0;transform:translateY(30px);pointer-events:none;transition:.5s;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);background:#222}
#player.show{opacity:1;transform:none;pointer-events:auto}
#player iframe{width:100%;height:152px;border:0}
#pfb{display:none;height:152px;align-items:center;justify-content:center;color:#fff;font:22px sans-serif;text-align:center;padding:16px}
#pfb a{color:#b9f5c8}
#pclose{position:absolute;right:6px;top:2px;color:#fff;font:26px sans-serif;cursor:pointer;z-index:2;text-shadow:0 0 4px #000}
</style>
</head>
<body>

<div id="rot"><div class="rbox"><div class="ph"></div><div class="bar"></div><div>ROTATE<br>YOUR<br>PHONE</div></div></div>

<!-- 1: passcode -->
<section class="page active" id="p-pass"><div class="stage">
  <img class="art" src="passcode.png" alt="">
  <div class="cover" style="left:520px;top:40px;width:440px;height:225px"></div>
  <div class="ptitle rise">Enter passcode!!</div>
  <div id="boxes" class="rise">
    <div class="box" style="left:546px">*</div><div class="box" style="left:646px">*</div><div class="box" style="left:746px">*</div><div class="box" style="left:846px">*</div>
  </div>
  <div id="msg">incorrect password</div>
  <div id="keys"></div>
</div></section>

<!-- 2: cake -->
<section class="page" id="p-cake"><div class="stage">
  <div class="glow" id="glow"></div>
  <div class="cake-box rise">
    <div class="candle" onclick="blow()"><div class="flame" id="flame"></div><div class="wick"></div><div class="stick"></div></div>
    <div class="icing"></div><div class="drips"></div><div class="sponge"><div class="filling"></div></div><div class="plate"></div>
  </div>
  <div class="greet rise">happy birthday!</div>
  <div class="name rise">Albie</div>
  <div class="hint" id="hint">tap the candle ✨</div>
  <div class="nav next" onclick="go(2)">›</div>
</div></section>

<!-- 3: songs collage -->
<section class="page" id="p-songs"><div class="stage">
  <img class="art float" src="songs.png" alt="">
  <div class="hit" style="left:795px;top:25px;width:245px;height:335px" onclick="play(0)"></div>
  <div class="hit" style="left:1040px;top:60px;width:250px;height:335px" onclick="play(1)"></div>
  <div class="hit" style="left:735px;top:365px;width:250px;height:320px" onclick="play(2)"></div>
  <div class="hit" style="left:990px;top:405px;width:255px;height:315px" onclick="play(3)"></div>
  <div id="player"><div id="pclose" onclick="stopP()">×</div><iframe id="pf" allow="autoplay; encrypted-media" loading="lazy"></iframe><div id="pfb"></div></div>
  <div class="nav back" onclick="go(1)">‹</div><div class="nav next" onclick="go(3)">›</div>
</div></section>

<!-- 4: letter -->
<section class="page" id="p-letter"><div class="stage">
  <img class="art float" src="letter.png" alt="">
  <div class="nav back" onclick="go(2)">‹</div><div class="nav next" onclick="go(4)">›</div>
</div></section>

<!-- 5: flowers -->
<section class="page" id="p-flowers">
  <iframe id="fr" title="flowers"></iframe>
  <div class="stage" style="pointer-events:none"><div class="nav back" style="pointer-events:auto;background:rgba(235,225,242,.55)" onclick="go(3)">‹</div></div>
</section>

<script>
const CODE='0610', pages=[...document.querySelectorAll('.page')];
let cur=0, entry='';
function fit(){const s=Math.min(innerWidth/1366,innerHeight/768);document.querySelectorAll('.stage').forEach(e=>e.style.setProperty('--s',s))}
addEventListener('resize',fit);fit();

function go(n){
  pages[cur].classList.remove('active');
  if(n!==2)stopP();
  cur=n; pages[n].classList.add('active');
  const fr=document.getElementById('fr');
  if(n===4){fr.src='flower_animation.html'}else{setTimeout(()=>{if(cur!==4)fr.removeAttribute('src')},900)}
}


/* songs: put each Spotify track ID (the part after /track/ in the share link) in id */
const SONGS=[
 {id:'',q:'No One Noticed The Marías'},
 {id:'',q:'I Wanna Be Yours Arctic Monkeys'},
 {id:'',q:'Sweet Cigarettes After Sex'},
 {id:'',q:'In A Good Way Faye Webster'}];
function play(i){
  const s=SONGS[i],p=document.getElementById('player'),f=document.getElementById('pf'),fb=document.getElementById('pfb');
  p.classList.add('show');
  if(s.id){fb.style.display='none';f.style.display='block';f.src='https://open.spotify.com/embed/track/'+s.id+'?utm_source=generator&theme=0'}
  else{f.style.display='none';f.removeAttribute('src');fb.style.display='flex';
    fb.innerHTML='<a target="_blank" rel="noopener" href="https://open.spotify.com/search/'+encodeURIComponent(s.q)+'">Open on Spotify ♪</a>'}
}
function stopP(){document.getElementById('player').classList.remove('show');document.getElementById('pf').removeAttribute('src')}

/* keypad */
const keysEl=document.getElementById('keys'),boxes=[...document.querySelectorAll('.box')],msg=document.getElementById('msg'),bx=document.getElementById('boxes');
['1','2','3','4','5','6','7','8','9','x','0'].forEach((k,i)=>{
  const b=document.createElement('button');b.className='key rise';b.textContent=k;
  b.style.left=(624+[0,116,232][i%3]-50)+'px';b.style.top=(329+110*Math.floor(i/3)-50)+'px';
  b.style.animationDelay=(.4+i*.05)+'s';
  b.onclick=()=>press(k);keysEl.appendChild(b);
});
function draw(){boxes.forEach((b,i)=>{b.textContent=entry[i]||'*';b.classList.toggle('on',!!entry[i])})}
function press(k){
  if(bx.classList.contains('ok'))return;
  msg.classList.remove('show');
  if(k==='x'){entry=entry.slice(0,-1);draw();return}
  if(entry.length>=4)return;
  entry+=k;draw();
  if(entry.length===4){
    if(entry===CODE){bx.classList.add('ok');setTimeout(()=>go(1),700)}
    else{
      msg.classList.add('show');bx.classList.add('shake');
      setTimeout(()=>{bx.classList.remove('shake');entry='';draw()},600);
    }
  }
}
addEventListener('keydown',e=>{if(cur!==0)return;if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('x')});

/* cake */
function blow(){
  const f=document.getElementById('flame'),g=document.getElementById('glow');
  const out=f.classList.toggle('out');g.style.opacity=out?0:1;
  document.getElementById('hint').style.opacity=0;
  if(out){const st=document.querySelector('#p-cake .stage'),c=['#ff7675','#feca57','#74b9ff','#fff','#55efc4'];
    for(let i=0;i<60;i++){const d=document.createElement('div');d.className='conf';
      d.style.left=Math.random()*1366+'px';d.style.background=c[i%5];
      d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=Math.random()*.6+'s';
      st.appendChild(d);setTimeout(()=>d.remove(),5500)}}
}
</script>
</body>
</html>
